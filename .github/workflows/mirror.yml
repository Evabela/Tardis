name: mirroring

on: [push, pull_request]

env:
  MIRROR_SSH_URL: "git@github.com:EpitechPGE1-2025/G-AIA-210-NAN-2-1-tardis-2.git"

jobs:
  check_mirror:
    runs-on: ubuntu-latest
    outputs:
      is_mirror: ${{ steps.check.outputs.is_mirror }}
    steps:
      - id: check
        run: |
          if [[ "$MIRROR_SSH_URL" == *"$GITHUB_REPOSITORY"* ]]; then
            echo "is_mirror=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_mirror=false" >> "$GITHUB_OUTPUT"
          fi

  push_to_mirror:
    runs-on: ubuntu-latest
    needs: check_mirror
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check_mirror.outputs.is_mirror == 'false'
    steps:
      - name: take_files
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_SSH_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}